[package]
name = "ca-certs-in-code"
version = "0.2.0"
edition = "2021"
description = "Find bundled CA certificate stores in project dependencies, check runtime reachability, and inspect their contents"

[dependencies]
cargo-lock = "11"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
