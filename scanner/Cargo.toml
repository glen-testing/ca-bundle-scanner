[package]
name = "ca-bundle-scanner"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Find compromised or distrusted CA certificates in trust stores, bundles, binaries and archives"

[lib]
name = "ca_bundle_scanner"
path = "src/lib.rs"

[[bin]]
name = "ca-bundle-scanner"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
# Default backend is libbz2-rs-sys (pure Rust): no C build, still static on musl.
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
glob = "0.3"
lzma-rs = "0.3"
memchr = "2.7"
memmap2 = "0.9"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
walkdir = "2"
x509-parser = "0.18"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Release is also the test profile here (`cargo test --release`), so keep links fast.
[profile.release]
opt-level = 3
lto = "thin"

# Distribution build: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
