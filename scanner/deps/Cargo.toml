[package]
name = "ca-certs-in-code"
version = "0.2.0"
edition = "2021"
description = "Dependency analysis for ca-bundle-scanner: bundled CA stores in project dependencies and their runtime reachability"
publish = false

[dependencies]
cargo-lock = "11"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
anyhow = "1"
semver = "1"
