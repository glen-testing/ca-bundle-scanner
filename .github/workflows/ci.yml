name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly link check catches rotting sources
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Rust scanner (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scanner
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  scanner-platforms:
    name: Scanner on ${{ matrix.os }} (tests + platform store smoke run)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: scanner
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scanner
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      # Exit 1/3 are legitimate on a runner image; assert only that the platform stores were read.
      - run: |
          set +e
          ./target/release/ca-bundle-scanner --profile emudhra --json > scan.json
          code=$?
          set -e
          [ "$code" -le 3 ] && [ "$code" -ne 2 ]
          python3 -c "
          import json, sys
          r = json.load(open('scan.json'))
          locs = [l for l in r['locations'] if l['status'] == 'scanned']
          want = 'Windows certificate store' if sys.platform == 'win32' else 'macOS system roots keychain'
          hits = [l for l in locs if l['label'].startswith(want) and l['files'] > 0]
          print(len(locs), 'locations scanned;', len(hits), 'platform-store locations with certificates')
          sys.exit(0 if hits else 1)
          "

  data-site:
    name: Data schema, generated site, accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4 # runs the page's filter script in tools/test_site.py
        with:
          node-version: "22"
      - run: python3 tools/validate_data.py
      - run: python3 tools/build_site.py --check
      - run: python3 -m unittest discover -s tools -v

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Excluded hosts serve anti-bot 403 pages to CI; checked by hand 2026-11-02.
      # googlesource's rendered faq.md returns 503; its ?format=TEXT form returns 200.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^https://dev\.mysql\.com/'
            --exclude '^https://gitlab\.torproject\.org/'
            --exclude '^https://www\.cisco\.com/c/'
            --exclude '^https://chromium\.googlesource\.com/chromium/src/\+/main/net/data/ssl/chrome_root_store/faq\.md$'
            --max-concurrency 4
            --max-retries 3
            --timeout 30
            --accept 200..=299,429
            --user-agent "Mozilla/5.0 (compatible; ca-bundle-tracker link check)"
            docs/index.html data/ca-bundle-sources.json README.md
          fail: true
